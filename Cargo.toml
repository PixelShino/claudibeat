[package]
name = "claudibeat"
version = "0.1.0"
edition = "2024"
description = "Claude Desktop sessions, memory and plan limit in the left corner of the Windows 11 taskbar"
authors = ["Dmitry Goldobin", "Claude (Anthropic)"]
license = "MIT"
repository = "https://github.com/PixelShino/claudibeat"
readme = "README.md"
keywords = ["claude", "taskbar", "windows", "widget"]
categories = ["gui"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.58", features = ["Foundation_Numerics", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Wdk_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
# A taskbar widget should be small: one optimised unit, no symbols.
lto = true
codegen-units = 1
strip = true
panic = "abort"
