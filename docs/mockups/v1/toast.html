<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Уведомления</title><link rel="stylesheet" href="../base.css"></head><body><svg width="0" height="0" style="position:absolute"><defs>

<div class="scene" style="height:300px">

  <div class="x"><svg width="12" height="12"><use href="#g-x"/></svg></div>
</div>

  <div class="x"><svg width="12" height="12"><use href="#g-x"/></svg></div>

<div class="taskbar"><div class="widget vb">

<div class="item "><div class="top"><svg width="10" height="10"><use href="#g-done"/></svg>2</div><div class="sub">готово</div></div>

<div class="sep"></div>
<div class="item"><div class="top"><svg width="12" height="12" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--track)" stroke-width="2.25"/><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="2.25" stroke-dasharray="22.8 34.6" transform="rotate(-90 7 7)"/></svg> 66%</div><div class="sub">неделя</div></div>
</div></div>
</div></body></html>
