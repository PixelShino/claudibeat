<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>claudibeat promo</title>
<style>
  :root { --ink: #1d1d1f; --mute: #86868b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #fff; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #view { position: absolute; inset: 0; overflow: hidden; background: #cfd8e8; }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .abs { position: absolute; }

  /* the desktop */
  #wall { position: absolute; left: -800px; top: -600px; width: 3520px; height: 2280px;
    background:
      radial-gradient(900px 520px at 1760px 1420px, rgba(86, 140, 255, .55), transparent 70%),
      radial-gradient(760px 600px at 1100px 760px, rgba(186, 160, 255, .45), transparent 70%),
      radial-gradient(820px 560px at 2500px 880px, rgba(255, 196, 170, .45), transparent 70%),
      linear-gradient(160deg, #eef2fa 0%, #dde5f4 55%, #e9e4f3 100%); }
  .win { position: absolute; border-radius: 10px; background: #fbfbfa; box-shadow: 0 24px 60px rgba(20, 30, 60, .18), 0 0 0 1px rgba(0, 0, 0, .06); overflow: hidden; }
  .win .bar { height: 34px; display: flex; align-items: center; padding: 0 14px; font-size: 12.5px; color: #555; border-bottom: 1px solid #ececea; background: #f6f6f4; }
  .win .bar .ctl { margin-left: auto; display: flex; gap: 22px; color: #777; font-size: 12px; }
  .side { position: absolute; left: 0; top: 34px; bottom: 0; width: 250px; background: #f3f2ef; border-right: 1px solid #e7e6e2; padding: 14px 10px; }
  .side .row { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 7px; font-size: 12.5px; color: #333; white-space: nowrap; overflow: hidden; }
  .side .row.on { background: #e6e4de; }
  .side .row svg { flex: none; }
  .side .lbl { font-size: 11px; color: #999; margin: 10px 8px 6px; }
  .chat { position: absolute; left: 250px; top: 34px; right: 0; bottom: 0; padding: 34px 60px; }
  .bubble { background: #efede8; border-radius: 14px; height: 44px; margin: 0 0 18px auto; }
  .line { height: 9px; border-radius: 5px; background: #e3e1dc; margin: 0 0 12px; }
  .tool { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: #666; border: 1px solid #e5e3de; border-radius: 8px; padding: 6px 10px; margin: 4px 0 16px; }
  .input { position: absolute; left: 60px; right: 60px; bottom: 28px; height: 74px; border-radius: 14px; border: 1px solid #e2e0da; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .04); }

  /* the taskbar */
  #taskbar { position: absolute; left: 0; top: 1032px; width: 1920px; height: 48px; }
  #tbbg { position: absolute; left: -800px; top: 1032px; width: 3520px; height: 300px; background: rgba(238, 238, 240, .97); border-top: 1px solid rgba(0, 0, 0, .06); }
  .app { position: absolute; top: 10px; width: 28px; height: 28px; border-radius: 7px; }
  #clock { position: absolute; right: 18px; top: 7px; text-align: right; font-size: 12px; line-height: 17px; color: #222; }

  /* the strip, drawn like claudibeat draws it */
  #strip { position: absolute; left: 0; top: 0; height: 48px; width: 300px; font-size: 14.5px; }
  #strip .num { position: absolute; top: 13px; font-variant-numeric: tabular-nums; }
  #strip .ic { position: absolute; top: 17px; }
  #pill { position: absolute; left: 8px; top: 8.5px; width: 41px; height: 31.5px; border-radius: 7px; background: #1f1f1f; }
  #halo { position: absolute; left: -10px; top: -8px; width: 270px; height: 64px; border-radius: 16px; border: 2px solid rgba(40, 110, 255, .9); box-shadow: 0 0 0 6px rgba(40, 110, 255, .15); opacity: 0; }

  .card { position: absolute; border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16), 0 2px 6px rgba(0, 0, 0, .08); overflow: hidden; }
  .card img, .board img { display: block; width: 100%; height: 100%; }
  .board { position: absolute; border-radius: 9px; overflow: hidden; box-shadow: 0 18px 50px rgba(0, 0, 0, .2), 0 2px 8px rgba(0, 0, 0, .08); }

  #cursor { position: absolute; width: 14px; height: 21px; transform-origin: 1px 1px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .3)); }
  .ripple { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 2px solid rgba(30, 30, 30, .55); opacity: 0; }

  /* type */
  .cap { position: absolute; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.02em; opacity: 0; }
  .cap .a { font-size: 50px; font-weight: 650; line-height: 1.08; color: var(--ink); }
  .cap .b { font-size: 50px; font-weight: 650; line-height: 1.08; color: var(--mute); }
  .cap.small .a, .cap.small .b { font-size: 34px; }
  .cap .a, .cap .b { white-space: nowrap; width: max-content; }
  #capWide .a, #capBoard .a, #capBoard .b { margin: 0 auto; }
  .cap.mid .a, .cap.mid .b { font-size: 42px; }
  #title, #end { position: absolute; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #title .t1, #title .t2 { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-size: 64px; font-weight: 650; letter-spacing: -.025em; line-height: 1.12; }
  #title .t2 { color: var(--mute); }
  #end .mark { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-size: 86px; font-weight: 700; letter-spacing: -.035em; display: flex; align-items: center; gap: 18px; }
  #end .tag { font-size: 26px; color: #6e6e73; margin-top: 10px; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  #end .cmd { margin-top: 38px; font: 22px "Cascadia Mono", Consolas, monospace; background: #f2f2f4; border-radius: 12px; padding: 14px 24px; color: #1d1d1f; }
  #end .cmd span { color: #86868b; }
  #end .foot { margin-top: 18px; font-size: 17px; color: #86868b; }
</style>
</head>
<body>
<div id="view">
  <div id="world">
    <div id="wall"></div>
    <div id="desk">

    <div class="win" style="left:1040px; top:230px; width:760px; height:540px; opacity:.9">
      <div class="bar">Terminal</div>
      <div class="chat" style="left:0; padding:28px 34px">
        <div class="line" style="width:62%"></div><div class="line" style="width:48%"></div>
        <div class="line" style="width:71%"></div><div class="line" style="width:35%"></div>
        <div class="line" style="width:56%"></div><div class="line" style="width:66%"></div>
      </div>
    </div>

    <div class="win" style="left:250px; top:190px; width:1060px; height:740px">
      <div class="bar">Claude<div class="ctl"><span>—</span><span>☐</span><span>✕</span></div></div>
      <div class="side" id="side"></div>
      <div class="chat">
        <div class="bubble" style="width:46%"></div>
        <div class="line" style="width:88%"></div><div class="line" style="width:92%"></div><div class="line" style="width:64%"></div>
        <div class="tool" id="tool1"></div>
        <div class="line" style="width:84%"></div><div class="line" style="width:58%"></div>
        <div class="tool" id="tool2"></div>
        <div class="line" style="width:76%"></div>
        <div class="input"></div>
      </div>
    </div>

    </div>
    <div id="tbbg"></div>
    <div id="taskbar">
      <div id="halo"></div>
      <div id="strip">
        <div id="pill"></div>
        <svg class="ic" id="icWait" style="left:18.5px" width="7" height="14" viewBox="0 0 7 14"><circle cx="3.5" cy="7" r="3.5" fill="currentColor"/></svg>
        <div class="num" id="nWait" style="left:32.5px">0</div>
        <svg class="ic" style="left:56.5px; top:17px" width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.9" fill="none" stroke="currentColor" stroke-width="1.35"/><path d="M4.4 7.2 6.3 9 9.7 5.3" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="num" id="nDone" style="left:75px">0</div>
        <svg class="ic" style="left:98.5px; top:17px" width="13" height="13" viewBox="0 0 14 14"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 1.4v11.2"/><path d="M2.2 4.2l9.6 5.6"/><path d="M2.2 9.8l9.6-5.6"/></g></svg>
        <div class="num" id="nWork" style="left:117px">4</div>
        <div style="position:absolute; left:139px; top:14px; width:1px; height:20px; background:rgba(0,0,0,.12)"></div>
        <svg class="ic" style="left:154px; top:17px" width="13" height="13" viewBox="0 0 14 14"><rect x="2.3" y="3" width="9.4" height="8" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.35"/><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M5 3V1.6M9 3V1.6M5 12.4V11M9 12.4V11"/></g></svg>
        <div class="num" style="left:173.5px">59%</div>
        <svg class="ic" style="left:215.5px; top:17px" width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.4" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="2"/><path d="M7 1.6A5.4 5.4 0 1 1 1.95 8.9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <div class="num" style="left:234.5px">66%</div>
      </div>
      <div class="app" style="left:830px; background:linear-gradient(135deg,#3b82f6,#60a5fa); border-radius:50%"></div>
      <div class="app" style="left:874px; background:#e5e7eb"></div>
      <div class="app" style="left:918px; background:linear-gradient(135deg,#f59e0b,#fbbf24)"></div>
      <div class="app" style="left:962px; background:linear-gradient(135deg,#d97757,#e8a17f)"></div>
      <div class="app" style="left:1006px; background:linear-gradient(135deg,#1f2937,#4b5563)"></div>
      <div class="app" style="left:1050px; background:linear-gradient(135deg,#10b981,#34d399)"></div>
      <div id="clock">14:32<br>26.11.2026</div>
    </div>

    <div class="card" id="toastDone"><img id="imgDone"></div>
    <div class="card" id="toastWait"><img id="imgWait"></div>
    <div class="card" id="flyout"><img id="imgFly"></div>
    <div class="board" id="board">
      <img id="imgBoard">
      <img id="imgBoardDrag" class="abs" style="left:0; top:0; opacity:0">
      <img id="imgSource" class="abs" style="opacity:0; width:auto; height:auto">
    </div>
    <div class="card" id="ghost" style="opacity:0; border-radius:7px"><img id="imgGhost"></div>

    <div class="ripple" id="ripple"></div>
    <svg id="cursor" viewBox="0 0 14 21" style="opacity:0"><path d="M1 1v16.2l4-3.9 2.6 6 2.6-1.1-2.6-5.9h5.6z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>

  <div class="cap" id="capWide" style="left:0; right:0; top:52px; text-align:center"><div class="a"></div></div>
  <div class="cap" id="capDone" style="left:740px; top:300px"><div class="a"></div><div class="b"></div></div>
  <div class="cap mid" id="capWait" style="left:740px; top:304px"><div class="a"></div><div class="b"></div></div>
  <div class="cap" id="capFly" style="left:470px; top:260px"><div class="a"></div><div class="b"></div></div>
  <div class="cap small" id="capBoard" style="left:0; right:0; top:22px; text-align:center"><div class="a"></div><div class="b"></div></div>

  <div id="end" style="opacity:0">
    <div class="mark"><svg width="64" height="64" viewBox="0 0 14 14"><rect x=".5" y="2.5" width="13" height="9" rx="2.6" fill="#1f1f1f"/><circle cx="4.6" cy="7" r="1.5" fill="#fff"/><g stroke="#fff" stroke-width=".9" stroke-linecap="round"><path d="M9.4 4.6v4.8M7.3 5.8l4.2 2.4M7.3 8.2l4.2-2.4"/></g></svg>claudibeat</div>
    <div class="tag" id="endTag"></div>
    <div class="cmd"><span>&gt;</span> winget install PixelShino.claudibeat</div>
    <div class="foot" id="endFoot"></div>
  </div>
  <div id="title"><div class="t1" id="t1"></div><div class="t2" id="t2"></div></div>
</div>

<script>
const LANG = new URLSearchParams(location.search).get('lang') || 'en';
const TEXT = {
  en: {
    t1: 'Eight Claude chats at once.', t2: 'Which one is waiting for you?',
    wide: 'claudibeat counts them in your taskbar.',
    done: ['Finished?', 'You’ll know.'],
    wait: ['Waiting on you?', 'A black pill you can’t miss.'],
    fly: ['Every chat,', 'one click away.'],
    board: ['Drag a task onto a chat.', 'It takes it, does it and closes it.'],
    tag: 'Your Claude chats, counted in the taskbar.',
    foot: 'Free and open source · Windows 11',
    side: [['wait', 'Payments: refunds'], ['done', 'Coffee shop site: order form'], ['done', 'Price list parser'], ['work', 'Support bot: scenarios'], ['work', 'Auth refactor'], ['work', 'October traffic report'], ['work', 'Move the database to Postgres']],
    tools: ['Editing src/flows/refund.ts', 'Running the tests'],
  },
  ru: {
    t1: 'Восемь чатов Claude сразу.', t2: 'Какой из них ждёт тебя?',
    wide: 'claudibeat считает их прямо в панели задач.',
    done: ['Чат закончил?', 'Ты уже знаешь.'],
    wait: ['Ждёт ответа?', 'Не пропустишь.'],
    fly: ['Любой чат', 'в один клик.'],
    board: ['Перетащи задачу на чат.', 'Он возьмёт её, сделает и закроет.'],
    tag: 'Чаты Claude счётчиком в панели задач.',
    foot: 'Бесплатно, открытый код · Windows 11',
    side: [['wait', 'Платёжный модуль: возвраты'], ['done', 'Лендинг кофейни: форма заказа'], ['done', 'Парсер прайс-листов'], ['work', 'Бот поддержки: сценарии'], ['work', 'Рефакторинг авторизации'], ['work', 'Отчёт по трафику за октябрь'], ['work', 'Перенос базы в Postgres']],
    tools: ['Правит src/flows/refund.ts', 'Запускает тесты'],
  },
}[LANG];

const $ = (id) => document.getElementById(id);
const ICON = {
  wait: '<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3.6" fill="#1f1f1f"/></svg>',
  done: '<svg width="12" height="12" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.9" fill="none" stroke="#333" stroke-width="1.4"/><path d="M4.4 7.2 6.3 9 9.7 5.3" fill="none" stroke="#333" stroke-width="1.4"/></svg>',
  work: '<svg width="12" height="12" viewBox="0 0 14 14"><g stroke="#333" stroke-width="1.6" stroke-linecap="round"><path d="M7 1.4v11.2"/><path d="M2.2 4.2l9.6 5.6"/><path d="M2.2 9.8l9.6-5.6"/></g></svg>',
};

// ---- static text and images -------------------------------------------------
$('t1').textContent = TEXT.t1; $('t2').textContent = TEXT.t2;
$('capWide').querySelector('.a').textContent = TEXT.wide;
for (const [id, k] of [['capDone', 'done'], ['capWait', 'wait'], ['capFly', 'fly'], ['capBoard', 'board']]) {
  $(id).querySelector('.a').textContent = TEXT[k][0];
  $(id).querySelector('.b').textContent = TEXT[k][1];
}
$('endTag').textContent = TEXT.tag; $('endFoot').textContent = TEXT.foot;
$('side').innerHTML = '<div class="lbl">Recents</div>' + TEXT.side.map(([s, t], i) => `<div class="row${i === 0 ? ' on' : ''}">${ICON[s]}<span>${t}</span></div>`).join('');
$('tool1').innerHTML = ICON.work + TEXT.tools[0];
$('tool2').innerHTML = ICON.work + TEXT.tools[1];

const B = `build/${LANG}/`;
let META = null;
const half = (n) => n / 2;
async function boot() {
  META = await (await fetch(B + 'meta.json')).json();
  const set = (img, file) => new Promise((ok) => { $(img).onload = ok; $(img).src = B + file; });
  await Promise.all([
    set('imgDone', 'toast-done.png'), set('imgWait', 'toast-wait.png'), set('imgFly', 'flyout.png'),
    set('imgBoard', 'board.png'), set('imgBoardDrag', 'board-drag.png'), set('imgSource', 'source-faded.png'), set('imgGhost', 'ghost.png'),
  ]);
  await document.fonts.ready;
  const size = (id, m) => { $(id).style.width = half(m.w) + 'px'; $(id).style.height = half(m.h) + 'px'; };
  size('toastDone', META['toast-done']); size('toastWait', META['toast-wait']); size('flyout', META.flyout);
  size('board', META.board); size('ghost', META.ghost);
  $('imgBoardDrag').style.width = half(META.board.w) + 'px'; $('imgBoardDrag').style.height = half(META.board.h) + 'px';
  const s = META.source;
  Object.assign($('imgSource').style, { left: half(s.x) + 'px', top: half(s.y) + 'px', width: half(s.w) + 'px', height: half(s.h) + 'px' });
  // A caption longer than the room on the right gets a smaller size.
  for (const id of ['capDone', 'capWait', 'capFly']) {
    const el = $(id);
    const room = 1240 - el.offsetLeft;
    for (const line of el.children) {
      let size = parseFloat(getComputedStyle(line).fontSize);
      while (line.scrollWidth > room && size > 24) { size -= 1; line.style.fontSize = size + 'px'; }
    }
    const sizes = [...el.children].map((l) => parseFloat(getComputedStyle(l).fontSize));
    for (const line of el.children) line.style.fontSize = Math.min(...sizes) + 'px';
  }
  window.READY = true;
  render(0);
}

// ---- timing helpers ---------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x) => { const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
// fade in over [a, a+d], out over [b-d, b]
const life = (t, a, b, d = .4) => Math.min(outCubic(seg(t, a, a + d)), 1 - seg(t, b - d, b));

const SHOTS = {
  wideIn: [960, 540, .72], wide: [960, 540, 2 / 3], close: [320, 900, 2],
  fly: [744, 661.5, .86], board: [572, 689, .92],
};
const CAM = [
  [0, 'wideIn'], [2.4, 'wideIn'], [3.5, 'wide'], [4.7, 'wide'], [5.8, 'close'],
  [11.35, 'close'], [12.3, 'fly'], [13.7, 'fly'], [14.5, 'board'], [20.6, 'board'],
];
function camera(t) {
  let i = 0;
  while (i < CAM.length - 2 && t >= CAM[i + 1][0]) i++;
  const [ta, a] = CAM[i], [tb, b] = CAM[i + 1];
  const k = inOut(seg(t, ta, tb));
  const A = SHOTS[a], Bs = SHOTS[b];
  // move in log-zoom so a push-in feels even
  const z = Math.exp(lerp(Math.log(A[2]), Math.log(Bs[2]), k));
  const cx = lerp(A[0], Bs[0], k), cy = lerp(A[1], Bs[1], k);
  return { cx, cy, z };
}

// world positions (CSS px)
const TB = 1032;
function place(id, x, y, extra = '') { $(id).style.transform = `translate(${x}px, ${y}px) ${extra}`; }

function counter(el, value, popAt, t) {
  el.textContent = value;
  const p = popAt == null ? 0 : seg(t, popAt, popAt + .35);
  const s = p > 0 && p < 1 ? 1 + .35 * Math.sin(p * Math.PI) : 1;
  el.style.transform = `scale(${s})`;
  el.style.transformOrigin = '30% 60%';
}

const DURATION = 20.6;
window.DURATION = DURATION;

function render(t) {
  if (!META) return;
  // title card
  const tOut = seg(t, 2.25, 2.85);
  $('title').style.opacity = 1 - seg(t, 2.4, 3.0);
  for (const [id, a] of [['t1', .15], ['t2', .9]]) {
    const k = outCubic(seg(t, a, a + .65));
    $(id).style.opacity = k * (1 - tOut);
    $(id).style.transform = `translateY(${(1 - k) * 22}px) scale(${1 - .03 * tOut})`;
    $(id).style.filter = `blur(${(1 - k) * 8 + tOut * 6}px)`;
  }

  // camera, and a shallow depth of field: the desktop's windows go soft
  // whenever the shot is about claudibeat
  const c = camera(t);
  $('world').style.transform = `translate(${640 - c.cx * c.z}px, ${360 - c.cy * c.z}px) scale(${c.z})`;
  const soft = Math.max(clamp((c.z - .75) * 3.2, 0, 5), 4 * outCubic(seg(t, 11.35, 12.0)), 0);
  $('desk').style.filter = `blur(${soft}px)`;
  $('desk').style.opacity = 1 - .25 * clamp(soft / 4);

  // strip state
  const done = t >= 6.25 ? 1 : 0, wait = t >= 8.7 ? 1 : 0;
  counter($('nDone'), done, 6.25, t);
  counter($('nWait'), wait, 8.7, t);
  $('nDone').style.opacity = done ? 1 : .42;
  const pillK = outBack(seg(t, 8.65, 9.05));
  const pressed = t >= 11.2 && t < 11.38 ? .92 : 1;
  $('pill').style.opacity = clamp(pillK);
  $('pill').style.transform = `scale(${(.55 + .45 * pillK) * pressed})`;
  $('nWait').style.color = wait ? '#fff' : '#1b1b1b';
  $('nWait').style.opacity = wait ? 1 : .42;
  $('icWait').style.color = wait ? '#fff' : '#1b1b1b';
  $('icWait').style.opacity = wait ? 1 : .42;
  $('strip').style.color = '#1b1b1b';
  $('halo').style.opacity = life(t, 3.6, 4.9, .35) * (.55 + .45 * Math.sin((t - 3.6) * 5));

  // toasts: newest at the bottom
  const dh = half(META['toast-done'].h), wh = half(META['toast-wait'].h), gap = 8.5;
  const baseY = TB - 12;
  const doneIn = outCubic(seg(t, 6.3, 6.75));
  const waitIn = outCubic(seg(t, 8.75, 9.2));
  const away = outCubic(seg(t, 11.3, 11.65));
  const doneY = baseY - dh - (wh + gap) * outCubic(seg(t, 8.7, 9.15));
  place('toastDone', 8, doneY + (1 - doneIn) * 18 + away * 8, `scale(${.985 + .015 * doneIn})`);
  $('toastDone').style.opacity = doneIn * (1 - away);
  place('toastWait', 8, baseY - wh + (1 - waitIn) * 18 + away * 8, `scale(${.985 + .015 * waitIn})`);
  $('toastWait').style.opacity = waitIn * (1 - away);

  // the sessions window
  const flyIn = outCubic(seg(t, 11.35, 11.85));
  const flyOut = seg(t, 13.6, 13.9);
  const fh = half(META.flyout.h);
  place('flyout', 8, TB - 12.5 - fh + (1 - flyIn) * 16, `scale(${.985 + .015 * flyIn})`);
  $('flyout').style.transformOrigin = '0 100%';
  $('flyout').style.opacity = flyIn * (1 - flyOut);

  // the board
  const bw = half(META.board.w), bh = half(META.board.h);
  const bx = 8, by = TB - 12 - bh;
  const boardIn = outCubic(seg(t, 13.8, 14.35));
  place('board', bx, by + (1 - boardIn) * 18, `scale(${.97 + .03 * boardIn})`);
  $('board').style.transformOrigin = '50% 100%';
  $('board').style.opacity = boardIn;
  const g = META.ghost, s = META.source;
  const pick = 15.0, arrive = 16.15, drop = 16.55;
  const src = { x: bx + half(s.x) + 6, y: by + half(s.y) + 12 };
  const dst = { x: bx + half(g.x), y: by + half(g.y) };
  const grab = { x: 118, y: 26 };
  const mk = inOut(seg(t, pick + .12, arrive));
  const lift = outCubic(seg(t, pick, pick + .18));
  const gx = lerp(src.x, dst.x, mk), gy = lerp(src.y, dst.y, mk);
  const dragging = t >= pick && t < arrive;
  $('imgSource').style.opacity = t >= pick ? 1 : 0;
  $('ghost').style.opacity = dragging ? lift : 0;
  place('ghost', gx, gy, `scale(${1 + .03 * lift * (1 - mk * .6)}) rotate(${(1 - mk) * lift * -1.2}deg)`);
  $('imgBoardDrag').style.opacity = t >= arrive ? 1 : 0;

  // the cursor
  const pill = { x: 30, y: TB + 27 };
  const flyRow = { x: 210, y: TB - 12.5 - fh + 118 };
  const card = { x: src.x + grab.x, y: src.y + grab.y };
  let cx, cy, cv = 0;
  if (t < 10.2) { cx = 560; cy = 960; cv = 0; }
  else if (t < 11.1) { const k = inOut(seg(t, 10.25, 11.1)); cx = lerp(560, pill.x, k); cy = lerp(960, pill.y, k); cv = seg(t, 10.2, 10.4); }
  else if (t < 12.4) { cx = pill.x; cy = pill.y; cv = 1; }
  else if (t < 13.3) { const k = inOut(seg(t, 12.4, 13.2)); cx = lerp(pill.x, flyRow.x, k); cy = lerp(pill.y, flyRow.y, k); cv = 1; }
  else if (t < 14.3) { cx = flyRow.x; cy = flyRow.y; cv = 1; }
  else if (t < pick) { const k = inOut(seg(t, 14.3, 14.9)); cx = lerp(flyRow.x, card.x, k); cy = lerp(flyRow.y, card.y, k); cv = 1; }
  else if (t < arrive) { cx = gx + grab.x; cy = gy + grab.y; cv = 1; }
  else { cx = dst.x + grab.x; cy = dst.y + grab.y; cv = 1 - seg(t, 17.2, 17.5); }
  const press = (t >= 11.2 && t < 11.36) || (t >= pick - .05 && t < arrive + .4) ? .9 : 1;
  place('cursor', cx, cy, `scale(${press})`);
  $('cursor').style.opacity = cv;
  // click ripples
  let r = null;
  for (const [at, x, y] of [[11.2, pill.x, pill.y], [drop, dst.x + grab.x, dst.y + grab.y]]) {
    if (t >= at && t < at + .55) r = { k: seg(t, at, at + .55), x, y };
  }
  if (r) { place('ripple', r.x, r.y, `scale(${.4 + r.k * 1.4})`); $('ripple').style.opacity = (1 - r.k) * .9; }
  else $('ripple').style.opacity = 0;

  // captions
  const cap = (id, a, b, x = 0, y = 14) => {
    const k = life(t, a, b, .45);
    $(id).style.opacity = k;
    $(id).style.transform = `translate(${(1 - k) * x}px, ${(1 - k) * y}px)`;
    $(id).style.filter = `blur(${(1 - k) * 6}px)`;
  };
  cap('capWide', 3.15, 4.75);
  cap('capDone', 6.25, 8.55, 0, 16);
  cap('capWait', 8.7, 11.1, 0, 16);
  cap('capFly', 12.0, 13.75, 0, 16);
  cap('capBoard', 14.35, 17.7, 0, 10);
  const second = outCubic(seg(t, drop + .1, drop + .55));
  $('capBoard').querySelector('.b').style.opacity = second;
  for (const id of ['capDone', 'capWait', 'capFly']) {
    const el = $(id).querySelector('.b');
    el.style.opacity = 1;
  }

  // end card
  const endK = seg(t, 17.6, 18.1);
  $('end').style.opacity = endK;
  const parts = [['.mark', 17.95], ['.tag', 18.3], ['.cmd', 18.6], ['.foot', 18.9]];
  for (const [sel, at] of parts) {
    const k = outCubic(seg(t, at, at + .6));
    const el = $('end').querySelector(sel);
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - k) * 16}px)`;
    el.style.filter = `blur(${(1 - k) * 6}px)`;
  }
  // back to white at the very end, so the loop meets the title card
  $('view').style.background = '#cfd8e8';
}
window.render = render;
boot();
</script>
</body>
</html>
